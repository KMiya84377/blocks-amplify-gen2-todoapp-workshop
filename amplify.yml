version: 1
applications:
  - backend:
      phases:
        build:
          commands:
            - npm ci
            - export NODE_OPTIONS="--conditions=cdk"
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: todo-app
